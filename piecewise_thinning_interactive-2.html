<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piecewise Linear Thinning — Interactive</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d10;
    --bg-card: #11141a;
    --bg-panel: #161a22;
    --border: #1f2530;
    --border-hi: #2a3040;
    --fg: #ddd8cc;
    --fg-dim: #918a7c;
    --fg-muted: #5a5549;
    --accent-blue: #5b9bd5;
    --accent-gold: #d4a853;
    --accent-red: #c95d63;
    --accent-green: #6abf8a;
    --accent-purple: #9b8ec4;
    --rate-true: #c95d63;
    --rate-bound: #5b9bd5;
    --mono: 'JetBrains Mono', monospace;
    --serif: 'Crimson Pro', Georgia, serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--serif);
    line-height: 1.6;
    min-height: 100vh;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 2rem 4rem;
  }

  header {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-weight: 300;
    font-size: 2.2rem;
    letter-spacing: -0.025em;
  }
  header h1 span { color: var(--accent-gold); }

  header .sub {
    color: var(--fg-dim);
    font-size: 1.05rem;
    font-style: italic;
    margin-top: 0.3rem;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    padding: 0.8rem 0 1.5rem;
    font-size: 0.88rem;
    color: var(--fg-dim);
  }
  .legend-item {
    display: flex; align-items: center; gap: 0.4rem;
  }
  .lsw { width: 22px; height: 3px; border-radius: 1px; }
  .lsw.dash { background: repeating-linear-gradient(90deg, var(--accent-blue) 0 5px, transparent 5px 9px); }

  .viz-main {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .viz-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.8rem 1.2rem;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }

  .step-badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 3px;
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.06em;
    margin-right: 0.5rem;
  }
  .step-badge.init { background: var(--accent-purple); color: var(--bg); }
  .step-badge.reject { background: var(--accent-red); color: var(--bg); }
  .step-badge.accept { background: var(--accent-green); color: var(--bg); }

  .step-label {
    font-size: 1.05rem;
    color: var(--fg);
  }

  .btn-row {
    display: flex;
    gap: 0.5rem;
  }

  .btn {
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 0.4rem 1rem;
    border: 1px solid var(--border-hi);
    background: var(--bg);
    color: var(--fg-dim);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
    user-select: none;
  }
  .btn:hover { background: var(--bg-panel); color: var(--fg); border-color: var(--fg-muted); }
  .btn.primary {
    background: var(--accent-gold);
    color: var(--bg);
    border-color: var(--accent-gold);
    font-weight: 500;
  }
  .btn.primary:hover { background: #e0b45e; }
  .btn:disabled { opacity: 0.3; cursor: default; }
  .btn:disabled:hover { background: var(--bg); color: var(--fg-dim); border-color: var(--border-hi); }
  .btn.primary:disabled:hover { background: var(--accent-gold); color: var(--bg); }

  .svg-container {
    padding: 1rem;
    min-height: 380px;
  }

  svg text { font-family: 'Crimson Pro', Georgia, serif; }
  svg text.mono { font-family: 'JetBrains Mono', monospace; }

  .explanation-panel {
    border-top: 1px solid var(--border);
    padding: 1.2rem 1.5rem;
    background: var(--bg-panel);
    min-height: 100px;
  }

  .explanation-panel .math-line {
    margin-bottom: 0.6rem;
    font-size: 0.95rem;
    color: var(--fg-dim);
    line-height: 1.8;
  }
  .explanation-panel .math-line:last-child { margin-bottom: 0; }

  .explanation-panel .narration {
    color: var(--fg);
    font-size: 1rem;
    margin-bottom: 0.7rem;
    line-height: 1.7;
  }

  .explanation-panel .highlight { color: var(--accent-gold); }
  .explanation-panel .reject-text { color: var(--accent-red); font-weight: 600; }
  .explanation-panel .accept-text { color: var(--accent-green); font-weight: 600; }

  .katex { font-size: 1em; }
  .explanation-panel .katex { font-size: 1.05em; }

  .kb-hint {
    text-align: center;
    color: var(--fg-muted);
    font-size: 0.8rem;
    margin-top: 0.8rem;
    font-family: var(--mono);
  }
  .kb-hint kbd {
    display: inline-block;
    background: var(--bg-panel);
    border: 1px solid var(--border-hi);
    border-radius: 3px;
    padding: 0.1rem 0.4rem;
    font-size: 0.75rem;
    margin: 0 0.15rem;
  }

  .svg-fade-in {
    animation: svgFadeIn 0.4s ease-out forwards;
  }
  @keyframes svgFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .progress-row {
    display: flex;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.8rem 0 0;
  }
  .pdot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--border-hi);
    transition: all 0.25s;
  }
  .pdot.active { background: var(--accent-gold); transform: scale(1.3); }
  .pdot.done { background: var(--fg-muted); }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>Piecewise Linear <span>Thinning</span></h1>
  <p class="sub">Click through each sub-step — proposal, evaluation, accept/reject — across three iterations.</p>
</header>

<div class="legend">
  <div class="legend-item"><div class="lsw" style="background:var(--rate-true);"></div> True rate $\lambda(t)$</div>
  <div class="legend-item"><div class="lsw" style="background:var(--rate-bound);"></div> Bound $h(s)=as+b$</div>
  <div class="legend-item"><div class="lsw dash"></div> Extrapolated</div>
  <div class="legend-item"><div class="lsw" style="background:var(--accent-gold);"></div> Proposal</div>
  <div class="legend-item"><div class="lsw" style="background:var(--accent-green);"></div> Accepted</div>
  <div class="legend-item"><div class="lsw" style="background:var(--accent-red);"></div> Rejected</div>
</div>

<div class="viz-main">
  <div class="viz-toolbar">
    <div>
      <span class="step-badge init" id="badge">INIT</span>
      <span class="step-label" id="stepLabel">Initialization</span>
    </div>
    <div class="btn-row">
      <button class="btn" id="prevBtn" disabled>&larr; Back</button>
      <button class="btn primary" id="nextBtn">Next &rarr;</button>
    </div>
  </div>

  <div class="svg-container" id="svgContainer"></div>
  <div class="explanation-panel" id="explanationPanel"></div>
</div>

<div class="progress-row" id="progressRow"></div>

<div class="kb-hint">
  <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or click to navigate
</div>

</div>

<script>
// ============================
// DATA — tuned for good visual spacing
// ============================
const ALPHA = 1.2;
const T_INIT = 0.5;

// Coordinate mapping: t ∈ [0,5] → x ∈ [80,900], rate ∈ [0,3.5] → y ∈ [280,42]
function tx(t) { return 80 + t * 164; }
function ry(r) { return 280 - r * 68; }

// True rate: gentle, slowly rising curve
function trueRate(t) {
  return 1.0 + 0.6 * Math.sin(0.5 * t) + 0.15 * t + 0.1 * Math.sin(1.8 * t);
}

function rateCurvePath() {
  let pts = [];
  for (let i = 0; i <= 120; i++) {
    let t = i * 5.0 / 120;
    pts.push([tx(t), ry(trueRate(t))]);
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length; i++) {
    d += ` L${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}`;
  }
  return d;
}

// Iteration parameters — chosen so proposals land at t ≈ 1.3, 2.2, 2.9
const iters = [
  { t_prev: 0, b: null, a_val: null, U1: 0.88, U2: 0.92, result: 'reject' },
  { t_prev: null, b: null, a_val: null, U1: 0.88, U2: 0.90, result: 'reject' },
  { t_prev: null, b: null, a_val: null, U1: 0.80, U2: 0.35, result: 'accept' }
];

iters[0].b = ALPHA * trueRate(0);
iters[0].a_val = (ALPHA * trueRate(T_INIT) - iters[0].b) / T_INIT;

function computeIter(iter) {
  const xi = -Math.log(1 - iter.U1);
  const disc = iter.b * iter.b + 2 * iter.a_val * xi;
  const s = (-iter.b + Math.sqrt(disc)) / iter.a_val;
  const t_prop = iter.t_prev + s;
  const lam_true = trueRate(t_prop);
  const h_prop = iter.b + iter.a_val * s;
  const ratio = lam_true / h_prop;
  return { xi, disc, s, t_prop, lam_true, h_prop, ratio };
}

let r1 = computeIter(iters[0]);

iters[1].t_prev = r1.t_prop;
iters[1].b = ALPHA * r1.lam_true;
iters[1].a_val = (iters[1].b - iters[0].b) / (r1.t_prop - iters[0].t_prev);

let r2 = computeIter(iters[1]);

iters[2].t_prev = r2.t_prop;
iters[2].b = ALPHA * r2.lam_true;
iters[2].a_val = (iters[2].b - iters[1].b) / (r2.t_prop - iters[1].t_prev);

let r3 = computeIter(iters[2]);

const results = [r1, r2, r3];

// ============================
// SVG HELPERS
// ============================
const totalSteps = 10;
let currentStep = 0;

function fmt(v, d=2) { return v.toFixed(d); }
function fmt3(v) { return v.toFixed(3); }

function axesSVG() {
  let s = '';
  s += `<line x1="80" y1="280" x2="900" y2="280" stroke="#2a2a2a" stroke-width="1"/>`;
  s += `<line x1="80" y1="280" x2="80" y2="30" stroke="#2a2a2a" stroke-width="1"/>`;
  for (let i = 0; i <= 5; i++) {
    let x = tx(i);
    s += `<line x1="${x}" y1="280" x2="${x}" y2="285" stroke="#444" stroke-width="1"/>`;
    s += `<text x="${x}" y="298" fill="#5a5549" font-size="11" text-anchor="middle" class="mono">${i}</text>`;
  }
  for (let r = 1; r <= 3; r++) {
    let y = ry(r);
    s += `<line x1="76" y1="${y}" x2="80" y2="${y}" stroke="#333" stroke-width="1"/>`;
    s += `<text x="72" y="${y+4}" fill="#5a5549" font-size="10" text-anchor="end" class="mono">${r}</text>`;
  }
  s += `<text x="895" y="298" fill="#5a5549" font-size="13" font-style="italic" text-anchor="end">t</text>`;
  s += `<text x="66" y="38" fill="#5a5549" font-size="12" font-style="italic" text-anchor="end">rate</text>`;
  return s;
}

function trueCurveSVG() {
  return `<path d="${rateCurvePath()}" fill="none" stroke="var(--rate-true)" stroke-width="2.2" stroke-opacity="0.85" stroke-linejoin="round"/>` +
    `<text x="${tx(4.65).toFixed(0)}" y="${(ry(trueRate(4.65))-10).toFixed(0)}" fill="var(--rate-true)" font-size="13" font-style="italic">λ(t)</text>`;
}

function boundLineSVG(t0, b, a, t_end, opacity=1, dashed=false) {
  let x0 = tx(t0), y0 = ry(b);
  let s_end = t_end - t0;
  let x1 = tx(t_end), y1 = ry(b + a * s_end);
  let da = dashed ? ` stroke-dasharray="7,5"` : '';
  let w = dashed ? 1.5 : 2;
  return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}" stroke="var(--rate-bound)" stroke-width="${w}" opacity="${opacity}"${da}/>`;
}

function vertDashSVG(t_val, y_top, color="var(--accent-gold)", opacity=0.5) {
  let x = tx(t_val);
  return `<line x1="${x.toFixed(1)}" y1="280" x2="${x.toFixed(1)}" y2="${y_top.toFixed(1)}" stroke="${color}" stroke-width="1" stroke-dasharray="4,3" opacity="${opacity}"/>`;
}

function dotSVG(t_val, rate_val, color, r=4.5) {
  return `<circle cx="${tx(t_val).toFixed(1)}" cy="${ry(rate_val).toFixed(1)}" r="${r}" fill="${color}" stroke="var(--bg)" stroke-width="1.5"/>`;
}

function rejectXSVG(t_val, rate_val) {
  return `<text x="${tx(t_val).toFixed(1)}" y="${ry(rate_val).toFixed(1)}" fill="var(--accent-red)" font-size="26" font-weight="700" text-anchor="middle" dominant-baseline="central">✕</text>`;
}

function fadedRejectXSVG(t_val, rate_val) {
  return `<text x="${tx(t_val).toFixed(1)}" y="${ry(rate_val).toFixed(1)}" fill="var(--accent-red)" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="central" opacity="0.3">✕</text>`;
}

function acceptGlowSVG(t_val, rate_val) {
  let x = tx(t_val).toFixed(1), y = ry(rate_val).toFixed(1);
  return `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="var(--accent-green)" stroke-width="1.5" opacity="0.4" class="svg-fade-in"/>` +
         `<circle cx="${x}" cy="${y}" r="22" fill="none" stroke="var(--accent-green)" stroke-width="0.8" opacity="0.15" class="svg-fade-in"/>` +
         `<circle cx="${x}" cy="${y}" r="5.5" fill="var(--accent-green)" stroke="var(--accent-green)" stroke-width="2" class="svg-fade-in"/>`;
}

function sBracketSVG(t_start, t_end, label) {
  let x0 = tx(t_start), x1 = tx(t_end);
  let y = 312;
  return `<line x1="${(x0+4).toFixed(1)}" y1="${y}" x2="${(x1-4).toFixed(1)}" y2="${y}" stroke="var(--accent-gold)" stroke-width="1"/>` +
    `<line x1="${(x0+4).toFixed(1)}" y1="${y-5}" x2="${(x0+4).toFixed(1)}" y2="${y+5}" stroke="var(--accent-gold)" stroke-width="1"/>` +
    `<line x1="${(x1-4).toFixed(1)}" y1="${y-5}" x2="${(x1-4).toFixed(1)}" y2="${y+5}" stroke="var(--accent-gold)" stroke-width="1"/>` +
    `<text x="${((x0+x1)/2).toFixed(1)}" y="${y+16}" fill="var(--accent-gold)" font-size="12" text-anchor="middle" font-style="italic" class="mono">${label}</text>`;
}

// ============================
// BUILD SVG
// ============================
function buildSVG(step) {
  let parts = [];
  parts.push(axesSVG());
  parts.push(trueCurveSVG());

  // Step 0: init — show first bound segment + long dashed extension
  if (step === 0) {
    parts.push(boundLineSVG(0, iters[0].b, iters[0].a_val, 2.2, 1));
    let rateAt2_2 = iters[0].b + iters[0].a_val * 2.2;
    parts.push(boundLineSVG(2.2, rateAt2_2, 0, 3.5, 0.25, true));
    parts.push(dotSVG(0, iters[0].b, 'var(--rate-bound)', 4));
  }

  for (let i = 0; i < 3; i++) {
    let base = 1 + i * 3;
    let it = iters[i];
    let res = results[i];

    if (step < base) break;

    // Draw faded previous segments and reject marks
    if (i > 0) {
      for (let j = 0; j < i; j++) {
        let pit = iters[j];
        let pres = results[j];
        parts.push(boundLineSVG(pit.t_prev, pit.b, pit.a_val, pres.t_prop, 0.15));
        let mid = (pres.h_prop + pres.lam_true) / 2;
        parts.push(fadedRejectXSVG(pres.t_prop, mid));
      }
    }

    // Current bound: solid to proposal, long dashed beyond
    let solidEnd = (step >= base + 1) ? res.t_prop : it.t_prev + res.s;
    parts.push(boundLineSVG(it.t_prev, it.b, it.a_val, solidEnd, 0.9));

    if (step >= base + 1) {
      // Long dashed extension beyond the proposal
      let rateAtProp = it.b + it.a_val * res.s;
      let extT = res.t_prop + 1.5;
      parts.push(boundLineSVG(res.t_prop, rateAtProp, it.a_val, extT, 0.2, true));
    }

    // Knot dot
    parts.push(dotSVG(it.t_prev, it.b, 'var(--rate-bound)', 4));
    if (it.t_prev > 0) {
      parts.push(vertDashSVG(it.t_prev, ry(it.b), 'var(--fg-muted)', 0.25));
    }

    // Proposal vertical line + bracket
    if (step >= base) {
      let topRate = Math.max(res.h_prop, res.lam_true) + 0.25;
      parts.push(vertDashSVG(res.t_prop, ry(topRate), 'var(--accent-gold)', 0.45));
      parts.push(sBracketSVG(it.t_prev, res.t_prop, `s = ${fmt3(res.s)}`));
    }

    // Rate + bound dots and labels
    if (step >= base + 1) {
      parts.push(dotSVG(res.t_prop, res.h_prop, 'var(--rate-bound)', 4.5));
      parts.push(dotSVG(res.t_prop, res.lam_true, 'var(--rate-true)', 4.5));

      let xp = tx(res.t_prop);
      parts.push(`<text x="${(xp+16).toFixed(1)}" y="${(ry(res.h_prop)-5).toFixed(1)}" fill="var(--rate-bound)" font-size="11" class="mono">h = ${fmt(res.h_prop)}</text>`);
      parts.push(`<text x="${(xp+16).toFixed(1)}" y="${(ry(res.lam_true)+15).toFixed(1)}" fill="var(--rate-true)" font-size="11" class="mono">λ = ${fmt(res.lam_true)}</text>`);
    }

    // Accept / reject marker — ONLY green for actual accept
    if (step >= base + 2) {
      if (it.result === 'accept') {
        parts.push(acceptGlowSVG(res.t_prop, res.lam_true));
      } else {
        let mid = (res.h_prop + res.lam_true) / 2;
        parts.push(rejectXSVG(res.t_prop, mid));
      }
    }
  }

  return `<svg viewBox="0 0 960 340" xmlns="http://www.w3.org/2000/svg">${parts.join('\n')}</svg>`;
}

// ============================
// EXPLANATION
// ============================
function buildExplanation(step) {
  if (step === 0) {
    return `
      <p class="narration">Set up the initial piecewise linear bound above the true rate.</p>
      <p class="math-line">Evaluate the rate at two points to form the first linear segment:</p>
      <p class="math-line">$$\\lambda(0) = ${fmt(trueRate(0))}, \\qquad \\lambda(t_{\\text{init}}) = \\lambda(${fmt(T_INIT)}) = ${fmt(trueRate(T_INIT))}$$</p>
      <p class="math-line">Scale by $\\alpha = ${ALPHA}$ to create a majorizing bound:</p>
      <p class="math-line">$$b_0 = \\alpha\\,\\lambda(0) = ${fmt(iters[0].b)}, \\qquad a_0 = \\frac{\\alpha\\,\\lambda(t_{\\text{init}}) - b_0}{t_{\\text{init}}} = ${fmt(iters[0].a_val)}$$</p>
      <p class="math-line">The initial bound is $\\,h(s) = a_0\\, s + b_0 = ${fmt(iters[0].a_val)}\\,s + ${fmt(iters[0].b)}\\,$ with $\\,t_{\\text{prev}} = 0$.</p>
    `;
  }

  for (let i = 0; i < 3; i++) {
    let base = 1 + i*3;
    let it = iters[i];
    let res = results[i];
    let n = i + 1;

    if (step === base) {
      return `
        <p class="narration"><span class="highlight">Iteration ${n} — Propose a candidate time</span></p>
        <p class="math-line">Draw $\\,U_1 = ${fmt(it.U1)}\\,$ and compute the exponential variate:</p>
        <p class="math-line">$$\\xi = -\\ln(1 - U_1) = -\\ln(${fmt(1 - it.U1)}) = ${fmt3(res.xi)}$$</p>
        <p class="math-line">Invert the piecewise linear compensator $\\displaystyle\\int_0^s h(u)\\,du = \\xi\\;$ via the quadratic formula:</p>
        <p class="math-line">$$\\tfrac{a}{2}\\,s^2 + b\\,s - \\xi = 0 \\;\\;\\Longrightarrow\\;\\; s = \\frac{-b + \\sqrt{b^2 + 2a\\xi}}{a}$$</p>
        <p class="math-line">$$= \\frac{-${fmt(it.b)} + \\sqrt{${fmt(it.b)}^2 + 2(${fmt(it.a_val)})(${fmt3(res.xi)})}}{${fmt(it.a_val)}} = \\frac{-${fmt(it.b)} + \\sqrt{${fmt3(res.disc)}}}{${fmt(it.a_val)}} = ${fmt3(res.s)}$$</p>
        <p class="math-line">Proposal time: $\\;t_{${n}} = t_{\\text{prev}} + s = ${fmt(it.t_prev)} + ${fmt3(res.s)} = \\mathbf{${fmt3(res.t_prop)}}$</p>
      `;
    }

    if (step === base + 1) {
      return `
        <p class="narration"><span class="highlight">Iteration ${n} — Evaluate rate and bound at proposal</span></p>
        <p class="math-line">Evaluate the true intensity and the bound at $\\,t_{${n}} = ${fmt3(res.t_prop)}$:</p>
        <p class="math-line">$$\\lambda(t_{${n}}) = ${fmt3(res.lam_true)}, \\qquad h(s_{${n}}) = b + a \\cdot s = ${fmt(it.b)} + ${fmt(it.a_val)} \\times ${fmt3(res.s)} = ${fmt3(res.h_prop)}$$</p>
        <p class="math-line">Compute the thinning acceptance ratio:</p>
        <p class="math-line">$$\\rho = \\frac{\\lambda(t_{${n}})}{h(s_{${n}})} = \\frac{${fmt3(res.lam_true)}}{${fmt3(res.h_prop)}} = ${fmt3(res.ratio)}$$</p>
        <p class="math-line">The bound overshoots by a factor of $\\,${fmt3(1/res.ratio)}$. Wasted probability mass: $\\,1 - \\rho = ${fmt3(1 - res.ratio)}$.</p>
      `;
    }

    if (step === base + 2) {
      if (it.result === 'accept') {
        return `
          <p class="narration"><span class="highlight">Iteration ${n} — Thinning test: <span class="accept-text">Accepted!</span></span></p>
          <p class="math-line">Draw $\\,U_2 = ${fmt(it.U2)}\\,$ and compare to the ratio:</p>
          <p class="math-line">$$U_2 = ${fmt(it.U2)} \\;<\\; ${fmt3(res.ratio)} = \\rho \\qquad\\Longrightarrow\\qquad \\textbf{Accept}$$</p>
          <p class="math-line">Return $\\;\\boxed{\\,\\tau = t_{${n}} = ${fmt3(res.t_prop)}\\,}\\;$ as the next event time of the non-homogeneous Poisson process.</p>
          <p class="narration" style="margin-top:0.6rem;">The bound adapted across iterations. Acceptance ratios: $\\,${fmt3(results[0].ratio)} \\to ${fmt3(results[1].ratio)} \\to ${fmt3(results[2].ratio)}$. Each rejection gave a new knot, tightening the piecewise envelope around $\\lambda(t)$.</p>
        `;
      } else {
        let lk = ALPHA * res.lam_true;
        let next_it = iters[i+1];
        return `
          <p class="narration"><span class="highlight">Iteration ${n} — Thinning test: <span class="reject-text">Rejected</span></span></p>
          <p class="math-line">Draw $\\,U_2 = ${fmt(it.U2)}\\,$ and compare to the ratio:</p>
          <p class="math-line">$$U_2 = ${fmt(it.U2)} \\;>\\; ${fmt3(res.ratio)} = \\rho \\qquad\\Longrightarrow\\qquad \\textbf{Reject}$$</p>
          <p class="math-line">Update the bound by inserting a new knot at $\\,t_{${n}}$:</p>
          <p class="math-line">$$b_{\\text{new}} = \\alpha\\,\\lambda(t_{${n}}) = ${ALPHA} \\times ${fmt3(res.lam_true)} = ${fmt3(lk)}$$</p>
          <p class="math-line">$$a_{\\text{new}} = \\frac{b_{\\text{new}} - b_{\\text{old}}}{t_{${n}} - t_{\\text{prev}}} = \\frac{${fmt3(lk)} - ${fmt(it.b)}}{${fmt3(res.t_prop)} - ${fmt(it.t_prev)}} = ${fmt3(next_it.a_val)}$$</p>
          <p class="math-line">Set $\\;t_{\\text{prev}} \\leftarrow ${fmt3(res.t_prop)}\\;$ and continue with the updated linear segment.</p>
        `;
      }
    }
  }
  return '';
}

// ============================
// UI HELPERS
// ============================
function badgeForStep(step) {
  if (step === 0) return ['INIT', 'init'];
  for (let i = 0; i < 3; i++) {
    let base = 1 + i*3;
    if (step >= base && step < base + 3) {
      return [`ITER ${i+1}`, iters[i].result === 'accept' ? 'accept' : 'reject'];
    }
  }
  return ['', 'init'];
}

function labelForStep(step) {
  if (step === 0) return 'Initialization';
  for (let i = 0; i < 3; i++) {
    let base = 1 + i*3;
    if (step === base) return `Iteration ${i+1} — Propose candidate time`;
    if (step === base+1) return `Iteration ${i+1} — Evaluate rate & bound`;
    if (step === base+2) {
      return iters[i].result === 'accept'
        ? `Iteration ${i+1} — Accept ✓`
        : `Iteration ${i+1} — Reject & update bound`;
    }
  }
  return '';
}

// ============================
// RENDER
// ============================
const svgContainer = document.getElementById('svgContainer');
const explanationPanel = document.getElementById('explanationPanel');
const badgeEl = document.getElementById('badge');
const stepLabelEl = document.getElementById('stepLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const progressRow = document.getElementById('progressRow');

for (let i = 0; i < totalSteps; i++) {
  let dot = document.createElement('div');
  dot.className = 'pdot';
  progressRow.appendChild(dot);
}

function render() {
  svgContainer.innerHTML = buildSVG(currentStep);

  explanationPanel.innerHTML = buildExplanation(currentStep);
  renderMathInElement(explanationPanel, {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false}
    ],
    throwOnError: false
  });

  let [bText, bClass] = badgeForStep(currentStep);
  badgeEl.textContent = bText;
  badgeEl.className = 'step-badge ' + bClass;
  stepLabelEl.textContent = labelForStep(currentStep);

  prevBtn.disabled = currentStep === 0;
  nextBtn.disabled = currentStep === totalSteps - 1;
  nextBtn.textContent = currentStep === totalSteps - 1 ? 'Done' : 'Next →';

  let dots = progressRow.children;
  for (let i = 0; i < totalSteps; i++) {
    dots[i].className = 'pdot' + (i === currentStep ? ' active' : (i < currentStep ? ' done' : ''));
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderMathInElement(document.querySelector('.legend'), {
    delimiters: [{left: '$', right: '$', display: false}],
    throwOnError: false
  });
  render();
});

nextBtn.addEventListener('click', () => {
  if (currentStep < totalSteps - 1) { currentStep++; render(); }
});
prevBtn.addEventListener('click', () => {
  if (currentStep > 0) { currentStep--; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    if (currentStep < totalSteps - 1) { currentStep++; render(); }
  }
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (currentStep > 0) { currentStep--; render(); }
  }
});

render();
</script>
</body>
</html>
