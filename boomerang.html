<style>

<body>
<h1>Boomerang sampler</h1>
<div class="sub">E(&#946;) = (2 &#8722; &#946;<sub>1</sub>)&#178; + 5(&#946;<sub>2</sub> &#8722; &#946;<sub>1</sub>&#178;/2)&#178; &#183; &#946;* = (2, 2) &#183; Contours show level sets</div>
<div class="ctrls">
<button onclick="step(-1)">Previous</button>
<button onclick="step(1)">Next</button>
<button onclick="resetV()">Reset</button>
<button onclick="playAll()" id="bpl">Play all</button>
<button onclick="showAll()">Show all</button>
<button onclick="downloadSVG()">Download SVG</button>
<span class="step-inf" id="si">Initial state</span>
</div>
<div class="svg-wrap">
<svg id="ms" width="100%" viewBox="0 0 900 640"></svg>
<div class="info-box" id="ib"><div class="ib-type"><div class="ib-dot" style="background:#888780"></div>Initial state</div><div class="ib-desc">Elliptical dynamics around &#946;*. Press Next to begin.</div></div>
</div>
<div class="hzb"><div class="hzt">Competing clocks (horizon)</div><div id="hzc"><div style="font-size:12px;color:#888780">Step through events to see competing clocks</div></div></div>
<div class="leg">
<div class="li"><div class="ld" style="background:#7F77DD"></div>Trajectory</div>
<div class="li"><div class="ld" style="background:#639922"></div>Bounce</div>
<div class="li"><div class="ld" style="background:#E24B4A"></div>Rejected</div>
<div class="li"><div class="ld" style="background:#BA7517"></div>Refresh</div>
<div class="li"><svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#2C2C2A" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="#2C2C2A"/></svg>Skeleton pt</div>
<div class="li"><div class="ldl" style="border-color:#D85A30"></div>&#8711;U</div>
<div class="li"><div class="ldl" style="border-color:#534AB7"></div>v<sub>in</sub></div>
</div>
<div class="ed" id="ed"></div>
<script>
var svg=document.getElementById('ms'),ns='http://www.w3.org/2000/svg',W=900,H=640;
function Efn(b){return Math.pow(2-b[0],2)+5*Math.pow(b[1]-b[0]*b[0]/2,2)}
var pMnX=-0.3,pMxX=4.5,pMnY=-0.8,pMxY=4.5;
var margin=50,scX=(W-2*margin)/(pMxX-pMnX),scY=(H-2*margin)/(pMxY-pMnY);
var sc=Math.min(scX,scY),pCx=(pMnX+pMxX)/2,pCy=(pMnY+pMxY)/2,svCx=W/2,svCy=H/2;
function p2s(p){return[svCx+(p[0]-pCx)*sc,svCy-(p[1]-pCy)*sc]}
var bs=[2,2],dt=0.012;
var CL={bounce:'#639922',reject:'#E24B4A',refresh:'#BA7517'};
var NM={bounce:'Accepted bounce',reject:'Rejected proposal',refresh:'Velocity refresh'};
var allE=[],allS=[],states=[];
function arc(x0,v0,steps){var pts=[],x=[x0[0],x0[1]],v=[v0[0],v0[1]];
for(var i=0;i<=steps;i++){pts.push([x[0],x[1]]);var c=Math.cos(dt),s=Math.sin(dt),dx=[x[0]-bs[0],x[1]-bs[1]];
var nx=[bs[0]+dx[0]*c+v[0]*s,bs[1]+dx[1]*c+v[1]*s],nv=[-dx[0]*s+v[0]*c,-dx[1]*s+v[1]*c];
x=nx;v=nv}return{p:pts,x:x,v:v}}

function gradU(b){
  // ∇U for E(β) = (2-β₁)² + 5(β₂ - β₁²/2)²
  var d1=b[0]-2, d2=b[1]-b[0]*b[0]/2;
  return[-2*d1 + 5*2*d2*(-b[0]), 5*2*d2];
}

function build(){var evts=[],segs=[],t=0,x=[0.8,2.8],v=[0.9,0.4];
states=[{x:[0.8,2.8],v:[0.9,0.4],t:0}];
function pushS(s){states.push({x:[s.x[0],s.x[1]],v:[s.v[0],s.v[1]],t:s.t})}

// 1: BOUNCE (250 steps)
var a=arc(x,v,250);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=250*dt;
var g=gradU(x),gn=Math.sqrt(g[0]*g[0]+g[1]*g[1]),gU=[g[0]/gn,g[1]/gn];
var vI=[v[0],v[1]],ip=v[0]*gU[0]+v[1]*gU[1];
v=[v[0]-2*ip*gU[0],v[1]-2*ip*gU[1]];
evts.push({ty:'bounce',pos:p2s(x),v:[v[0],v[1]],vI:vI,gU:gU,ip:ip,t:+t.toFixed(2),sk:true,
ck:{bounce:0.85,refresh:2.50,w:'bounce'},
bt:'Accepted bounce',bd:'Poisson thinning accepted. Velocity reflects off \u2207U(\u03b2).',
bm:'\u27e8v, \u2207U\u27e9 = '+ip.toFixed(2)+' > 0\nv_out = v_in \u2212 2\u27e8v,\u2207U\u27e9/\u2016\u2207U\u2016\u00b2 \u00b7 \u2207U'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 2: REJECT (120 steps)
a=arc(x,v,120);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=120*dt;
evts.push({ty:'reject',pos:p2s(x),v:[v[0],v[1]],vI:null,gU:null,ip:0,t:+t.toFixed(2),sk:false,
ck:{bounce:0.62,refresh:1.65,w:'reject'},bt:'Rejected proposal',bd:'Thinning failed. Trajectory continues on the same orbit. No skeleton point recorded.',bm:'u > \u03bb(\u03c4*) / \u03bb\u0304\nNo state change'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 3: REFRESH (160 steps)
a=arc(x,v,160);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=160*dt;
v=[0.5,-1.2];
evts.push({ty:'refresh',pos:p2s(x),v:[v[0],v[1]],vI:null,gU:null,ip:0,t:+t.toFixed(2),sk:true,
ck:{bounce:1.30,refresh:1.03,w:'refresh'},bt:'Velocity refresh',bd:'\u03c4_refresh expired first. Fresh velocity drawn from reference measure.',bm:'v ~ \u03a3\u00b9\u2044\u00b2 N(0, I)\nNew ellipse'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 4: BOUNCE (200 steps)
a=arc(x,v,200);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=200*dt;
g=gradU(x);gn=Math.sqrt(g[0]*g[0]+g[1]*g[1]);gU=[g[0]/gn,g[1]/gn];
vI=[v[0],v[1]];ip=v[0]*gU[0]+v[1]*gU[1];
v=[v[0]-2*ip*gU[0],v[1]-2*ip*gU[1]];
evts.push({ty:'bounce',pos:p2s(x),v:[v[0],v[1]],vI:vI,gU:gU,ip:ip,t:+t.toFixed(2),sk:true,
ck:{bounce:0.72,refresh:1.85,w:'bounce'},
bt:'Accepted bounce',bd:'Velocity reflects off the gradient. Trajectory changes direction.',
bm:'\u27e8v, \u2207U\u27e9 = '+ip.toFixed(2)+' > 0\nReflection applied'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 5: BOUNCE (180 steps)
a=arc(x,v,180);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=180*dt;
g=gradU(x);gn=Math.sqrt(g[0]*g[0]+g[1]*g[1]);gU=[g[0]/gn,g[1]/gn];
vI=[v[0],v[1]];ip=v[0]*gU[0]+v[1]*gU[1];
v=[v[0]-2*ip*gU[0],v[1]-2*ip*gU[1]];
evts.push({ty:'bounce',pos:p2s(x),v:[v[0],v[1]],vI:vI,gU:gU,ip:ip,t:+t.toFixed(2),sk:true,
ck:{bounce:0.55,refresh:2.10,w:'bounce'},
bt:'Accepted bounce',bd:'Another accepted reflection. The sampler explores the banana-shaped ridge.',
bm:'\u27e8v, \u2207U\u27e9 = '+ip.toFixed(2)+' > 0\nReflection applied'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 6: REJECT (100 steps)
a=arc(x,v,100);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=100*dt;
evts.push({ty:'reject',pos:p2s(x),v:[v[0],v[1]],vI:null,gU:null,ip:0,t:+t.toFixed(2),sk:false,
ck:{bounce:0.48,refresh:0.95,w:'reject'},bt:'Rejected proposal',bd:'Thinning failed again. Orbit unchanged.',bm:'u > \u03bb(\u03c4*) / \u03bb\u0304\nNo state change'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 7: REFRESH (140 steps)
a=arc(x,v,140);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=140*dt;
v=[-0.3,0.8];
evts.push({ty:'refresh',pos:p2s(x),v:[v[0],v[1]],vI:null,gU:null,ip:0,t:+t.toFixed(2),sk:true,
ck:{bounce:1.10,refresh:0.78,w:'refresh'},bt:'Velocity refresh',bd:'\u03c4_refresh expired first. New velocity resets the elliptical orbit.',bm:'v ~ \u03a3\u00b9\u2044\u00b2 N(0, I)\nNew ellipse'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 8: BOUNCE (220 steps)
a=arc(x,v,220);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=220*dt;
g=gradU(x);gn=Math.sqrt(g[0]*g[0]+g[1]*g[1]);gU=[g[0]/gn,g[1]/gn];
vI=[v[0],v[1]];ip=v[0]*gU[0]+v[1]*gU[1];
v=[v[0]-2*ip*gU[0],v[1]-2*ip*gU[1]];
evts.push({ty:'bounce',pos:p2s(x),v:[v[0],v[1]],vI:vI,gU:gU,ip:ip,t:+t.toFixed(2),sk:true,
ck:{bounce:0.40,refresh:1.60,w:'bounce'},
bt:'Accepted bounce',bd:'Reflection redirects the trajectory back toward the mode.',
bm:'\u27e8v, \u2207U\u27e9 = '+ip.toFixed(2)+' > 0\nReflection applied'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 9: BOUNCE (150 steps)
a=arc(x,v,150);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=150*dt;
g=gradU(x);gn=Math.sqrt(g[0]*g[0]+g[1]*g[1]);gU=[g[0]/gn,g[1]/gn];
vI=[v[0],v[1]];ip=v[0]*gU[0]+v[1]*gU[1];
v=[v[0]-2*ip*gU[0],v[1]-2*ip*gU[1]];
evts.push({ty:'bounce',pos:p2s(x),v:[v[0],v[1]],vI:vI,gU:gU,ip:ip,t:+t.toFixed(2),sk:true,
ck:{bounce:0.30,refresh:1.40,w:'bounce'},
bt:'Accepted bounce',bd:'The sampler has traced out the curved ridge of the Rosenbrock banana.',
bm:'\u27e8v, \u2207U\u27e9 = '+ip.toFixed(2)+' > 0\nReflection applied'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// 10: REFRESH (90 steps)
a=arc(x,v,90);segs.push({p:a.p.map(p2s)});x=a.x;v=a.v;t+=90*dt;
v=[0.6,0.3];
evts.push({ty:'refresh',pos:p2s(x),v:[v[0],v[1]],vI:null,gU:null,ip:0,t:+t.toFixed(2),sk:true,
ck:{bounce:1.50,refresh:0.65,w:'refresh'},bt:'Velocity refresh',bd:'Final refresh. New orbit begins.',bm:'v ~ \u03a3\u00b9\u2044\u00b2 N(0, I)\nNew ellipse'});
pushS({x:x,v:v,t:+t.toFixed(2)});

// Tail (60 steps)
a=arc(x,v,60);segs.push({p:a.p.map(p2s)});
allE=evts;allS=segs}
build();

var cP=[];
(function(){var lv=[0.3,1,3,8,20,50,120,250],nx=200,ny=200,x0=pMnX,x1=pMxX,y0=pMnY,y1=pMxY,dx=(x1-x0)/nx,dy=(y1-y0)/ny,g=[];
for(var j=0;j<=ny;j++){g[j]=[];for(var i=0;i<=nx;i++){g[j][i]=Efn([x0+i*dx,y0+j*dy])}}
for(var li=0;li<lv.length;li++){var l=lv[li],pa=[];
for(var j=0;j<ny;j++){for(var i=0;i<nx;i++){
var v00=g[j][i],v10=g[j][i+1],v01=g[j+1][i],v11=g[j+1][i+1];
var code=(v00>=l?8:0)|(v10>=l?4:0)|(v11>=l?2:0)|(v01>=l?1:0);if(code===0||code===15)continue;
function interp(va,vb,ax,ay,bx,by){var t=(l-va)/(vb-va);return p2s([x0+(ax+t*(bx-ax))*dx,y0+(ay+t*(by-ay))*dy])}
var ed={top:function(){return interp(v00,v10,i,j,i+1,j)},right:function(){return interp(v10,v11,i+1,j,i+1,j+1)},bottom:function(){return interp(v01,v11,i,j+1,i+1,j+1)},left:function(){return interp(v00,v01,i,j,i,j+1)}};
var sm={1:[['left','bottom']],2:[['bottom','right']],3:[['left','right']],4:[['top','right']],5:[['top','left'],['bottom','right']],6:[['top','bottom']],7:[['top','left']],8:[['top','left']],9:[['top','bottom']],10:[['top','right'],['bottom','left']],11:[['top','right']],12:[['left','right']],13:[['bottom','right']],14:[['bottom','left']]};
if(sm[code]){for(var si=0;si<sm[code].length;si++){var s=sm[code][si];var p1=ed[s[0]](),p2=ed[s[1]]();pa.push('M'+p1[0].toFixed(1)+' '+p1[1].toFixed(1)+'L'+p2[0].toFixed(1)+' '+p2[1].toFixed(1))}}
}}cP.push({d:pa.join('')})}})();

function pts2d(pts){if(pts.length<2)return'';var d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);for(var i=1;i<pts.length;i++)d+=' L'+pts[i][0].toFixed(1)+' '+pts[i][1].toFixed(1);return d}
function el(tag,at){var e=document.createElementNS(ns,tag);for(var k in at)e.setAttribute(k,at[k]);return e}
function rIB(step){var ib=document.getElementById('ib');
if(step<=0){ib.innerHTML='<div class="ib-type"><div class="ib-dot" style="background:#888780"></div>Initial state</div><div class="ib-desc">Elliptical dynamics around \u03b2*. Press Next.</div>';return}
if(step>allE.length){ib.innerHTML='<div class="ib-type"><div class="ib-dot" style="background:#888780"></div>All '+allE.length+' events</div><div class="ib-desc">Use Previous/Next to inspect.</div>';return}
var e=allE[step-1],c=CL[e.ty],sk=e.sk?'<span class="ib-sk sky">skeleton pt</span>':'<span class="ib-sk skn">no skeleton pt</span>';
ib.innerHTML='<div class="ib-type"><div class="ib-dot" style="background:'+c+'"></div>'+e.bt+' '+sk+'</div><div class="ib-desc">'+e.bd+'</div>'+(e.bm?'<div class="ib-math">'+e.bm.replace(/\n/g,'<br>')+'</div>':'')}
function rHz(step){var hc=document.getElementById('hzc');
if(step<=0||step>allE.length){hc.innerHTML='<div style="font-size:12px;color:#888780">Step through events to see competing clocks</div>';return}
var ck=allE[step-1].ck;if(!ck){hc.innerHTML='';return}
var it=[{k:'bounce',l:'\u03c4*',c:'#639922',v:ck.bounce},{k:'refresh',l:'\u03c4_ref',c:'#BA7517',v:ck.refresh}];
var fi=it.filter(function(i){return isFinite(i.v)}),mx=fi.length?Math.max.apply(null,fi.map(function(i){return i.v}))*1.15:2;if(mx<0.1)mx=2;
var h='';for(var i=0;i<it.length;i++){var t=it[i],w=isFinite(t.v)?Math.min(100,(t.v/mx)*100):100,iw=ck.w===t.k||(ck.w==='reject'&&t.k==='bounce'),vs=isFinite(t.v)?t.v.toFixed(2):'\u221e';
h+='<div class="hr"><span class="hl">'+t.l+'</span><div class="ht"><div class="hf" style="width:'+w+'%;background:'+t.c+';opacity:'+(iw?0.45:0.15)+'"></div>'+(isFinite(t.v)?'<div class="hm" style="left:calc('+w+'% - 1px);background:'+t.c+'"></div>':'')+'</div><span class="hv '+(iw?'hw':'')+'" style="'+(isFinite(t.v)?'':'opacity:0.35')+'">'+vs+(iw?' \u2190':'')+'</span></div>'}
var mn=fi.length?Math.min.apply(null,fi.map(function(i){return i.v})):0;
h+='<div class="hs">h = min(\u03c4*, \u03c4_ref) = <b>'+(isFinite(mn)?mn.toFixed(2):'\u221e')+'</b> \u2192 <b>'+(NM[ck.w]||ck.w)+'</b></div>';hc.innerHTML=h}

function render(step){while(svg.childElementCount>0)svg.removeChild(svg.lastChild);
var defs=el('defs',{});defs.innerHTML='<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>';svg.appendChild(defs);
var cg=el('g',{}),op=[0.5,0.45,0.4,0.35,0.28,0.2,0.14,0.1];
for(var i=0;i<cP.length;i++){if(cP[i].d)cg.appendChild(el('path',{d:cP[i].d,fill:'none',stroke:'#D85A30','stroke-width':'0.8',opacity:String(op[i]||0.1)}))}svg.appendChild(cg);
var g=el('g',{}),o=p2s([0,0]),aL=p2s([pMnX,0]),aR=p2s([pMxX,0]),aT=p2s([0,pMxY]),aB=p2s([0,pMnY]);
g.appendChild(el('line',{x1:aL[0],y1:o[1],x2:aR[0],y2:o[1],stroke:'rgba(0,0,0,0.1)','stroke-width':'0.5'}));
g.appendChild(el('line',{x1:o[0],y1:aT[1],x2:o[0],y2:aB[1],stroke:'rgba(0,0,0,0.1)','stroke-width':'0.5'}));
var l1=el('text',{x:aR[0]-4,y:o[1]-8,class:'ts','text-anchor':'end'});l1.textContent='\u03b2\u2081';g.appendChild(l1);
